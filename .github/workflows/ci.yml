name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # PRs share one group per branch so a new push cancels the superseded run. Pushes to
  # main get a group per commit: a shared group keeps only one pending run, so
  # back-to-back merges would silently drop a queued run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6
      - name: Dummy ttc.properties (CI never sees the real key)
        run: |
          cat > ttc.properties <<'PROPS'
          # CI dummy values, not a real key
          ttc.gatewayBaseUrl=https://transit.ttc.com.ge/pis-gateway
          ttc.gatewayKey=ci-dummy-key
          ttc.firebaseApiKey=ci-dummy
          ttc.firebaseProjectId=ci-dummy
          ttc.firebaseAppId=ci-dummy
          PROPS
      - name: Gate
        run: ./gradlew spotlessCheck detekt lint test assembleDebug verifyRoborazziDebug :core:predict:koverVerify --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
